name: Build social preview image
on:
  push:
    branches: [main]
    paths:
      - 'assets/og-preview.svg'
      - '.github/workflows/build-og.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Korean fonts and SVG renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk librsvg2-bin
      - name: Render site-matched preview at 1200x630
        run: rsvg-convert -w 1200 -h 630 assets/og-preview.svg -o og-image.png
      - name: Commit rendered image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add og-image.png
          git diff --cached --quiet || (git commit -m "Refresh social preview image" && git push)
